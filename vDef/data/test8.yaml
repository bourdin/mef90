verbose: 0
time:
  min: 0
  max: 15
  numstep: 21
heatxfer:
  timestepping:
    type: steadystate
defmech:
  timestepping:
    type: quasistatic
boundaryDisplacement:
  scaling: linear
boundaryTemperature:
  scaling: linear
temperature:
  export: 1
cs0001:
  linearThermalexpansion: 1e-4,1e-2,0
  damage:
    type: AT1
    internalLength: 0.5
    fractureToughness: 1
    residualStiffness: 1e-6
    elastic: false
  plasticity:
    type: NONE
  HookesLaw:
    type: isotropic
    isotropic:
      YoungsModulus: 1
      PoissonRatio: 0.3
      planeStress: false
fs0020:
  displacementBC: 1,1,1
  boundaryDisplacement: -.5,0,0
  damageBC: 1
  boundaryDamage: 0
  temperatureBC: 1
  boundaryTemperature: 0
fs0030:
  displacementBC: 1,0,1
  boundaryDisplacement: .5,0,0
  damageBC: 1
  boundaryDamage: 0
  temperatureBC: 1
  boundaryTemperature: 100
